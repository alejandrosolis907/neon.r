
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEÓN-R</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a0a0f;
      color: #fff;
      --cta-prelogin-mobile-shift: 0mm;
    }

    /* Splash Screen */
    #splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #0a0a0f;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      animation: fadeOut 2s ease 3s forwards;
    }
    #splash img {
      width: 120px;
      margin-bottom: 20px;
    }
    #splash h1 {
      font-size: 2em;
      color: #d4af37;
      margin: 0;
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      background-color: #111122;
      border-bottom: 1px solid #333;
    }
    header .left,
    header .right {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    header .right {
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      align-self: flex-start;
    }
    header img {
      height: 40px;
    }
    .user-code {
      font-weight: bold;
    }
    .status {
      background: #0f0;
      color: #000;
      font-weight: bold;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.9em;
    }

    .settings-container {
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 10px 30px 0;
      gap: 20px;
      width: 100%;
      flex-wrap: wrap;
    }

    .settings-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #cta-stack {
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    #cta-panel {
      transform: translateX(var(--cta-prelogin-mobile-shift));
    }

    body.cta-aligned #cta-stack {
      margin-left: auto;
      margin-right: auto;
    }

    body:not(.cta-aligned) #cta-stack {
      max-width: min(664px, calc(100% - 72px));
      margin: 40px auto 52px;
      gap: 20px;
    }

    #fab-stack {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      display: none;
    }

    #fab-stack .card-actions {
      position: absolute;
      right: max(16px, env(safe-area-inset-right));
      top: 120px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      pointer-events: auto;
      align-items: center;
    }

    .settings {
      background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0) 60%), #161627;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 50%;
      cursor: pointer;
      color: #fff;
      position: relative;
      padding: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 14px rgba(20, 255, 255, 0.18);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .settings:hover {
      transform: translateY(-1px) scale(1.02);
      box-shadow: 0 0 18px rgba(20, 255, 255, 0.32);
    }
    .settings svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .settings-label {
      position: absolute;
      top: 50%;
      right: 100%;
      transform: translateY(-50%);
      background: #111122;
      padding: 4px 8px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      font-size: 0.85em;
    }
    .settings:hover .settings-label {
      opacity: 1;
    }

    .neo-offer-btn {
      background: linear-gradient(135deg, #ffea00, #ff7b00);
      color: #1a0d00;
      font-weight: 800;
      font-size: 0.9rem;
      letter-spacing: 0.05em;
      border: none;
      border-radius: 999px;
      padding: 14px 24px;
      cursor: pointer;
      box-shadow: 0 0 18px rgba(255, 153, 0, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
      text-transform: uppercase;
      text-align: center;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      line-height: 1.3;
    }

    @media (max-width: 768px) {
      .topbar {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .topbar .left,
      .topbar .right {
        width: auto;
      }

      .topbar .right {
        flex-direction: row;
        align-items: center;
        gap: 12px;
        align-self: center;
      }

      .settings-container {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        align-items: flex-start;
        gap: 12px;
        padding: 16px;
        width: 100%;
        box-sizing: border-box;
        justify-items: stretch;
      }

      .settings-actions {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: stretch;
        transform: none;
      }

      .settings-actions .simulator-access {
        width: 100%;
      }

      body.cta-aligned #cta-stack {
        width: calc(100% - 44px);
        margin-left: auto;
        margin-right: auto;
        margin-top: 32px;
      }

      body:not(.cta-aligned) #cta-stack {
        width: calc(100% - 44px);
      }

      body.cta-aligned #cta-panel {
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        transform: translateX(-3mm);
      }

      body:not(.cta-aligned) #cta-panel {
        margin-left: auto;
        margin-right: auto;
        width: 100%;
      }

      #neo-offer-wrapper {
        margin-left: 0;
        margin-right: 0;
        padding-left: 0;
        padding-right: 0;
        width: 100%;
      }

      .wallet-card {
        position: relative;
        overflow: visible;
      }

      #cta-stack {
        position: relative;
      }

      #fab-stack {
        position: static;
        inset: auto;
        display: block;
        pointer-events: auto;
        z-index: auto;
        justify-self: end;
        align-self: start;
      }

      #fab-stack .card-actions {
        position: static;
        display: flex;
        flex-direction: column;
        gap: 12px;
        align-items: flex-end;
      }

      body.cta-aligned .settings-container {
        position: relative;
        padding-right: calc(16px + 56px + 12px);
      }

      body.cta-aligned #fab-stack {
        position: absolute;
        top: 16px;
        right: max(16px, env(safe-area-inset-right));
        z-index: 10;
      }

      body.cta-aligned #fab-stack .card-actions {
        align-items: flex-end;
      }

      .side-actions .fab {
        width: 56px;
        height: 56px;
      }
    }

    .neo-offer-wrapper {
      display: none;
      max-width: 320px;
      width: 100%;
      margin: 20px auto 40px;
      padding: 0 30px;
    }

    .neo-offer-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 0 25px rgba(255, 153, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .neo-offer-btn:active {
      transform: translateY(0);
      box-shadow: 0 0 16px rgba(255, 153, 0, 0.6), inset 0 0 8px rgba(255, 255, 255, 0.4);
    }

    body:not(.cta-aligned) #cta-panel {
      max-width: min(604px, calc(100% - 72px));
      width: 100%;
      padding: clamp(25px, 4.3vw, 44px) clamp(20px, 5vw, 52px);
      margin: 0 auto;
    }

    body.cta-aligned #cta-panel {
      max-width: min(604px, calc(100% - 72px));
      width: 100%;
      padding: clamp(25px, 4.3vw, 44px) clamp(20px, 5vw, 52px);
      margin: -50px auto 0;
    }

    @media (max-width: 768px) {
      body:not(.cta-aligned) #cta-stack {
        max-width: calc(100% - 44px);
        margin: 28px auto 42px;
        gap: 12px;
        transform: none;
      }

      body:not(.cta-aligned) #cta-panel,
      body.cta-aligned #cta-panel {
        max-width: 100%;
        padding: 22px 16px;
      }

      #neo-offer-wrapper {
        margin: 12px auto 32px;
        padding: 0 16px;
      }

      body.cta-aligned #cta-button {
        margin-top: 8px;
      }

      body:not(.cta-aligned) {
        --cta-prelogin-mobile-shift: -4mm;
      }
    }

    @media (max-width: 480px) {
      body:not(.cta-aligned) #cta-stack {
        margin: 22px auto 32px;
      }

      body:not(.cta-aligned) #cta-panel,
      body.cta-aligned #cta-panel {
        padding: 19px 12px;
      }
    }

    body.cta-aligned #cta-button {
      margin-top: -22px;
    }

    @media (max-width: 768px) {
      body.cta-aligned #cta-panel {
        margin: 24px auto 0;
      }

      body.cta-aligned #cta-button {
        margin-top: 8px;
      }
    }

    @media (min-width: 768px) {
      body.cta-aligned #cta-panel {
        margin-top: -168px;
      }

      body.cta-aligned #cta-button {
        margin-top: -44px;
      }
    }

    @media (min-width: 1280px) {
      body.cta-aligned #cta-panel {
        margin-top: -168px;
      }

      body.cta-aligned #cta-button {
        margin-top: -46px;
      }
    }

    @media (max-width: 767px) {
      body.cta-aligned #cta-panel {
        padding-top: 45px;
      }
    }

    @media (max-width: 768px) {
      .topbar {
        height: 56px;
        padding: 8px 12px;
        position: relative;
      }

      .status-badge {
        position: absolute;
        top: 8px;
        right: 12px;
      }

      .primary-actions {
        position: static;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-self: start;
        align-self: start;
        max-width: min(33vw, 240px);
        width: 100%;
      }

      .primary-actions .simulator-access {
        width: 100%;
      }

      .side-actions {
        position: static;
        display: flex;
        flex-direction: column;
        gap: 12px;
        justify-self: end;
        align-items: flex-end;
      }

      body.cta-aligned .auth-panel {
        max-width: 640px;
        width: 92%;
        margin-left: auto;
        margin-right: auto;
      }

      body.cta-aligned .settings-container {
        margin-bottom: 12px;
      }
    }

    @media (min-width: 769px) {
      .primary-actions,
      .side-actions {
        position: static;
        width: auto;
        top: auto;
        right: auto;
        left: auto;
      }
    }

    .container {
      max-width: 600px;
      margin: 40px auto;
      background: #14141c;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0,0,0,0.7);
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #d4af37;
    }

    .tabs {
      display: flex;
      justify-content: center;
      margin-bottom: 20px;
    }
    .tabs button {
      flex: 1;
      padding: 10px;
      background: #111122;
      border: none;
      color: #fff;
      cursor: pointer;
    }
    .tabs button.active {
      background: #1c1c2c;
      border-bottom: 2px solid #d4af37;
    }

    form {
      display: none;
      flex-direction: column;
    }
    form.active {
      display: flex;
    }
    input, select {
      padding: 10px;
      margin: 10px 0;
      border-radius: 6px;
      border: 1px solid #333;
      background: #0f0f1a;
      color: #fff;
    }
    button.submit {
      background: #d4af37;
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .password-wrapper {
      position: relative;
    }
    .toggle-password {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
    }
    .password-wrapper input {
      padding-right: 40px;
    }
    .toggle-password .eye {
      width: 20px;
      height: 20px;
      stroke: #fff;
      fill: none;
    }
    .toggle-password .eye circle {
      fill: #fff;
    }
    .toggle-password .eye-open {
      display: none;
    }
    .toggle-password.open .eye-open {
      display: block;
    }
    .toggle-password.open .eye-closed {
      display: none;
    }

    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #333;
      padding: 10px 20px;
      border-radius: 6px;
      display: none;
    }
    #toast.show {
      display: block;
    }

    .neo-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 2px solid #d4af37;
      background: #14141c;
      display: inline-block;
      margin-left: 8px;
      position: relative;
    }
    .neo-icon::after {
      content: '';
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #d4af37;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    button.buy {
      background: #0f0;
      color: #000;
    }

    .simulator-access {
      background: #1e90ff;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin: 0;
      transition: background 0.2s ease;
      text-decoration: none;
      display: inline-flex;
      justify-content: center;
      align-items: center;
    }

    .simulator-access:not(.youtube-link):not(.tiktok-link):hover {
      background: #1870cc;
    }

    .simulator-access.youtube-link {
      background: #d32f2f;
    }

    .simulator-access.youtube-link:hover {
      background: #b71c1c;
    }

    .simulator-access.tiktok-link {
      background: #000;
      color: #fff;
      border: 2px solid #e5e5e5;
    }

    .simulator-access.tiktok-link:hover {
      background: #1a1a1a;
      border-color: #fff;
    }


    button.transfer {
      background: #333;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 10px;
    }

    #settings-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    #settings-modal .content {
      background: #14141c;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    #transfer-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
    }

    #transfer-modal .content {
      background: #14141c;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }
  
    /* Token dorado */
    .token {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 6px solid #d4af37;
      background: #14141c;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 0 10px #d4af37;
    }
    .token::after {
      content: '';
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #d4af37;
    }
  </style>
</head>
<body>
  <!-- Pantalla de bienvenida -->
  <div id="splash">
    <img src="logo.png" alt="Logo NEO EON">
    <h1>Bienvenido a NEÓN-R</h1>
  </div>

  <header class="topbar">
    <div class="left">
      <img src="logo.png" alt="Logo">
      <span id="user-code" class="user-code"></span>
    </div>
    <div class="right">
      <div class="status status-badge">Sistema en línea</div>
    </div>
  </header>

  <div id="settings-container" class="settings-container" style="display:none;">
    <div class="settings-actions primary-actions">
      <button id="simulator-btn" class="simulator-access" type="button">RENTAR SIMULADOR</button>
      <button id="video-game-btn" class="simulator-access" type="button">RENTAR VIDEO JUEGO</button>
      <button id="youtube-btn" class="simulator-access youtube-link" type="button">YOUTUBE</button>
      <button id="tiktok-btn" class="simulator-access tiktok-link" type="button">TIK TOK</button>
    </div>
    <div id="fab-stack" class="side-actions">
      <div class="card-actions">
        <button id="settings-btn" class="settings fab fab-settings" type="button" aria-label="Configuración" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 0 0 2.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 0 0 1.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 0 0-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 0 0-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 0 0-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 0 0-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 0 0 1.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 0 0 2.572-1.065z"/>
            <path d="M10 9h4a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1h-4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/>
          </svg>
          <span class="settings-label">Configuración</span>
        </button>
        <button id="participate-btn" class="settings fab fab-gift" type="button" aria-label="Participa" title="Participa" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
            <polyline points="20 12 20 22 4 22 4 12"></polyline>
            <rect x="2" y="7" width="20" height="5"></rect>
            <line x1="12" y1="22" x2="12" y2="7"></line>
            <path d="M12 7 7.5 2A2.5 2.5 0 0 0 5 7c0 2 2 2 7 2"></path>
            <path d="M12 7 16.5 2A2.5 2.5 0 0 1 19 7c0 2-2 2-7 2"></path>
          </svg>
          <span class="settings-label">Participa</span>
        </button>
      </div>
    </div>

  </div>

  <div id="cta-stack">
    <div id="cta-panel" class="container wallet-card auth-panel">
      <div class="token"></div>
      <h2 id="title">Accede a tu cuenta</h2>
      <div class="tabs">
      <button id="tab-register" class="active">Registro</button>
      <button id="tab-login">Ingreso</button>
    </div>

    <form id="register-form" class="active">
      <input id="reg-first" type="text" placeholder="Nombre" required>
      <input id="reg-last" type="text" placeholder="Apellidos" required>
      <select id="reg-gender" required>
        <option value="" disabled selected>Sexo</option>
        <option value="hombre">Hombre</option>
        <option value="mujer">Mujer</option>
      </select>
      <input id="reg-email" type="email" placeholder="Correo" required>
      <div class="password-wrapper">
        <input id="reg-password" type="password" placeholder="Contraseña" required>
        <span class="toggle-password" data-target="reg-password">
          <svg class="eye eye-closed" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg class="eye eye-open" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      <div class="password-wrapper">
        <input id="reg-password2" type="password" placeholder="Confirmar Contraseña" required>
        <span class="toggle-password" data-target="reg-password2">
          <svg class="eye eye-closed" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg class="eye eye-open" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      <button class="submit" type="submit">Crear Cuenta</button>
    </form>

    <form id="login-form">
      <input id="login-email" type="email" placeholder="Correo" required>
      <div class="password-wrapper">
        <input id="login-password" type="password" placeholder="Contraseña" required>
        <span class="toggle-password" data-target="login-password">
          <svg class="eye eye-closed" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          <svg class="eye eye-open" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
        </span>
      </div>
      <button class="submit" type="submit">Ingresar</button>
    </form>

    <div id="currency-section" style="display:none; margin-top:20px;">
      <div id="balance"><span id="neo-balance">0 NEO</span><div class="neo-icon"></div></div>
      <select id="currency-select"></select>
      <span id="currency-display" style="display:none;"></span>
      <input type="number" id="amount" placeholder="Cantidad en USD" min="1">
      <button id="buy-btn" class="buy" type="button">Comprar</button>
      <button id="transfer-btn" class="transfer" type="button">Transferir</button>
      <div id="rate">7 MXN = 1 NEO</div>
    </div>
  </div>

    <div id="neo-offer-wrapper" class="neo-offer-wrapper" style="display:none;">
      <button id="cta-button" class="neo-offer-btn" type="button">NEOS GRATIS POR TIEMPO LIMITADO Y EXCLUSIVO</button>
    </div>
  </div>

  <div id="toast"></div>

  <div id="settings-modal">
    <div class="content">
      <h3>Configuración</h3>
      <label for="settings-currency">Divisa</label>
      <select id="settings-currency"></select>
      <div style="margin-top:15px;">
        <button id="close-settings" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <div id="transfer-modal">
    <div class="content">
      <h3>Enviar NEO</h3>
      <input id="transfer-code" type="text" placeholder="Código de usuario">
      <input id="transfer-amount" type="number" placeholder="Cantidad de NEO" min="1">
      <div style="margin-top:15px;">
        <button id="transfer-send" type="button">Enviar</button>
        <button id="transfer-close" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
